<!DOCTYPE html>
<html lang="zh-CN"></html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>以太坊地址看板</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   <h2>模拟交易统计</h2>
    <div class="filters">
    <label for="minAmount">最低金额：</label>
    <input id="minAmount" type="number" value="150">
<button id="calculate" class="primary">统计交易</button>
</div>
    <p id="result"></p>
<ul id="transactionList">
</ul>
<h2>以太坊地址看板</h2>
<label for="walletAddress">以太坊地址：</label>
<input id="walletAddress" type="text" placeholder="0x…">
<button id="checkBalance">查询余额</button>
<p id="balanceResult"></p>
<button id="loadHistory">查询交易记录</button>
<p id="historyResult"></p>
<ul id="historyList"></ul>
<button id="refreshBlock">刷新区块高度</button>
<p id="blockHeight"></p>
<button id="connectWallet">连接钱包</button>
<p id="walletStatus">钱包未连接</p>
<script src="app.js"></script>
</body>
</html>
